<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olden Era 数据控制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">heros-base</p>
          <h1>Olden Era 数据控制台</h1>
          <p class="subtle">本地抓取、生成和校验《英雄无敌：上古纪元》小程序资料 JSON。</p>
        </div>
        <div class="env-switch" role="group" aria-label="环境选择">
          <button class="env-btn active" data-env="release">release</button>
          <button class="env-btn" data-env="dev">dev</button>
        </div>
      </header>

      <section class="status-grid" id="summary"></section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>数据文件</h2>
            <p>查看当前环境各分类输出数量，以及来源页面是否存在异常。</p>
          </div>
        </div>
        <div class="file-table-wrap">
          <table class="file-table">
            <thead>
              <tr>
                <th>分类</th>
                <th>文件</th>
                <th>条目</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody id="fileRows"></tbody>
          </table>
        </div>
        <div class="source-alerts" id="sourceAlerts"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>任务</h2>
            <p>同一时间只运行一个任务，长任务可以在下方日志区看实时输出。</p>
          </div>
          <div class="panel-actions">
            <button class="danger-btn" id="stopBtn" disabled>停止当前任务</button>
            <button class="ghost-btn" id="refreshBtn">刷新状态</button>
          </div>
        </div>
        <div class="task-grid" id="taskGrid"></div>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <div>
            <h2>运行日志</h2>
            <p id="logTitle">暂无运行任务</p>
          </div>
        </div>
        <pre id="logOutput">选择并运行一个任务后，这里会显示日志。</pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
